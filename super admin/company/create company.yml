info:
  name: create company
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/company"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: RH Global
      - name: email
        type: text
        value: sangram@gmail.com
      - name: phone
        type: text
        value: "8888888889"
      - name: address
        type: text
        value: rr nagar
      - name: status
        type: text
        value: active
      - name: contactPersonName
        type: text
        value: sangram
      - name: regDetails
        type: text
        value: GSTIN27ABCDE1234F1Z5
      - name: country
        type: text
        value: India
      - name: logo
        type: file
        value:
          - /home/lucky/Downloads/friend.jpeg
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
