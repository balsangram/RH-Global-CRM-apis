info:
  name: create visa country
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/visa/countries/"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: multipart-form
    data:
      - name: countryName
        type: text
        value: Japan
      - name: countryCode
        type: text
        value: JP
      - name: flagEmoji
        type: text
        value: 🇨🇦
        disabled: true
      - name: image
        type: file
        value:
          - /home/lucky/Downloads/alexa-m-OqDx0pa6VXI-unsplash.jpg
        contentType: image/jpeg
      - name: description
        type: text
        value: Study, visit, and work permits for Canada
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
