info:
  name: create visa country copy copy
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/visa/"
  body:
    type: multipart-form
    data:
      - name: country
        type: text
        value: 6ad099d88814ef7404eab0cc
      - name: packageName
        type: text
        value: Canada Student Direct Stream (SDS) Visa
      - name: visaType
        type: text
        value: Student Visa
      - name: image
        type: file
        value:
          - /home/lucky/Downloads/insia.webp
        contentType: image/webp
        disabled: true
      - name: sideImages[0]
        type: text
        value: Study, visit, and work permits for Canada
        disabled: true
      - name: sideImages[1]
        type: text
        value: ""
        disabled: true
      - name: validityPeriod
        type: text
        value: Up to 3 Years
      - name: permittedStayDuration
        type: text
        value: Duration of study program
      - name: standardProcessingTime
        type: text
        value: 4 to 6 weeks
      - name: embassyStatus
        type: text
        value: Accepting Applications
      - name: estimatedCost
        type: text
        value: "15000"
      - name: costBreakdown.visaFee
        type: text
        value: "9500"
      - name: costBreakdown.serviceFee
        type: text
        value: "5500"
      - name: costBreakdown.currency
        type: text
        value: INR
      - name: costBreakdown.note
        type: text
        value: Includes biometrics and embassy processing charges
      - name: qualification[0]
        type: text
        value: 12th Standard / High School completion for Diploma/Bachelor programs
      - name: qualification[1]
        type: text
        value: Bachelor Degree with minimum 55% for Master/PG Diploma programs
      - name: education[0]
        type: text
        value: Official Letter of Acceptance (LOA) from a Canadian DLI Institution
      - name: education[1]
        type: text
        value: Academic marksheets, degree certificate, and transcripts
      - name: job[0]
        type: text
        value: Work experience letters and payslips (if any study gap)
      - name: job[1]
        type: text
        value: No work experience mandatory for fresh graduates
      - name: languageRequirement[0]
        type: text
        value: "IELTS Academic: minimum 6.0 overall (no band less than 5.5)"
      - name: languageRequirement[1]
        type: text
        value: "PTE Academic: minimum score of 60"
      - name: ageLimit
        type: text
        value: 18 - 35 years
      - name: financialRequirements
        type: text
        value: 1 Year tuition fee paid receipt + GIC Certificate of CAD 20,635
      - name: eligibilityCriteria[0]
        type: text
        value: Valid passport with at least 6 months validity
      - name: eligibilityCriteria[1]
        type: text
        value: Upfront medical examination by panel physician
      - name: eligibilityCriteria[2]
        type: text
        value: Clean criminal record (Police Clearance Certificate)
      - name: documentRequirements[0][documentName]
        type: text
        value: Valid Passport (Current & Previous)
      - name: documentRequirements[0][requirementType]
        type: text
        value: MANDATORY
      - name: documentRequirements[0][description]
        type: text
        value: Clear scan of photo and address pages in PDF format
      - name: documentRequirements[1][documentName]
        type: text
        value: GIC Certificate
      - name: documentRequirements[1][requirementType]
        type: text
        value: ALTERNATIVE
      - name: documentRequirements[1][groupName]
        type: text
        value: groupName
      - name: documentRequirements[1][description]
        type: text
        value: FD in student or sponsor's name
      - name: documentRequirements[2][documentName]
        type: text
        value: Statement of Purpose (SOP)
      - name: documentRequirements[2][requirementType]
        type: text
        value: OPTIONAL
      - name: documentRequirements[2][description]
        type: text
        value: Explanation of study goals and intent to return
      - name: documentGroupRules[0][groupName]
        type: text
        value: Financial Proof
      - name: documentGroupRules[0][minRequired]
        type: text
        value: "2"
      - name: documentGroupRules[0][documents][0]
        type: text
        value: GIC Certificate
      - name: documentGroupRules[0][documents][1]
        type: text
        value: Bank Statement (Last 6 Months)
      - name: documentGroupRules[0][ruleDescription]
        type: text
        value: Please submit any 2 of the 3 listed financial documents
      - name: stepByStepGuidance[0]
        type: text
        value: "Step 1: Get admission offer letter from a designated DLI institution"
      - name: stepByStepGuidance[1]
        type: text
        value: "Step 2: Pay 1st year tuition fee and purchase GIC certificate"
      - name: stepByStepGuidance[2]
        type: text
        value: "Step 3: Complete upfront medical examination"
      - name: stepByStepGuidance[3]
        type: text
        value: "Step 4: Prepare academic and financial documents"
      - name: stepByStepGuidance[4]
        type: text
        value: "Step 5: Submit visa application online and schedule biometrics appointment"
      - name: faqs[0][question]
        type: text
        value: Can international students work while studying in Canada?
      - name: faqs[0][answer]
        type: text
        value: Yes, eligible students can work up to 20 hours per week off-campus during academic semesters and full-time during scheduled breaks.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
