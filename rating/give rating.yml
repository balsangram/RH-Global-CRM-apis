info:
  name: give rating
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/rating"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value:
          - /home/lucky/Pictures/_ (10).jpeg
        contentType: image/jpeg
      - name: packageId
        type: text
        value: 6ae2d9db65114e9b29bb3eb8
      - name: rating
        type: text
        value: "1"
      - name: message
        type: text
        value: nice
      - name: customerName
        type: text
        value: sangram
      - name: customerEmail
        type: text
        value: ss@gmail.com
      - name: customerPhone
        type: text
        value: "8765432124"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
